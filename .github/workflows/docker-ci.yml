
name: Nginx Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Build Docker image
      - name: Build Docker image
        run: docker build --pull -t "$IMAGE" .
        env:
          IMAGE: moinrazvi/nginx-docker-cicd:${{ github.sha }}

      # Step 3: Scan image for vulnerabilities
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moinrazvi/nginx-docker-cicd:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      # Step 4: Login to Docker Hub
      - name: Login to Docker Hub
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      # Step 5: Push image to Docker Hub
      - name: Push image to Docker Hub
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          IMAGE: moinrazvi/nginx-docker-cicd:${{ github.sha }}
        run: |
          docker tag "$IMAGE" moinrazvi/nginx-docker-cicd:latest
          docker push "$IMAGE"
          docker push moinrazvi/nginx-docker-cicd:latest

