name: Nginx Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -t "$IMAGE" .
        env:
          IMAGE: moinrazvi/nginx-docker-cicd:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moinrazvi/nginx-docker-cicd:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE" "moinrazvi/nginx-docker-cicd:latest"
          docker push "$IMAGE"
          docker push "moinrazvi/nginx-docker-cicd:latest"
        env:
          IMAGE: moinrazvi/nginx-docker-cicd:${{ github.sha }}

